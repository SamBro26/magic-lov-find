workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Prepare CLI and Dependencies
        script: |
          npm install --legacy-peer-deps
          npm install --save-dev @react-native-community/cli
      - name: Generate Android and Build APK
        script: |
          if [ ! -d "android" ]; then
            # استخدام الأداة الحديثة الموصى بها رسميا مع تخطي الأسئلة التفاعلية
            npx react-native-community/cli init TempApp --skip-install --yes
            cp -r TempApp/android ./android
            rm -rf TempApp
          fi
          cd android && ./gradlew assembleRelease
