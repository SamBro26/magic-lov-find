workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install --save-dev @react-native-community/cli
      - name: Generate Android Folder and Build APK
        script: |
          if [ ! -d "android" ]; then
            npx react-native@latest init TemporaryProject --template react-native-template-typescript
            mv TemporaryProject/android ./android
            rm -rf TemporaryProject
          fi
          cd android && ./gradlew assembleRelease
