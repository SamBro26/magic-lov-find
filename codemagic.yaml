workflows:
  react-native-android:
    name: React Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate Android Folder and Build APK
        script: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --clean || npx react-native eject --no-install
          fi
          cd android && ./gradlew assembleRelease
  artifacts:
    - android/app/build/outputs/apk/release/*.apk
