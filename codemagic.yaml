workflows:
  native-android:
    name: Android Native Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          cd $(find . -name "gradlew" | head -n 1)) && chmod +x gradlew && ./gradlew assembleRelease
    artifacts: 
      - "**/build/outputs/apk/release/*.apk
